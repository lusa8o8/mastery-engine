name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-contracts.txt
      - run: npm run lint
      - run: npm run test:s0
      - run: npm run test:s1
      - run: npm run test:s2a
      - run: npm run test:s4a
      - run: npm run test:oauth
      - run: npm run build
